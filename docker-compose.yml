services:
  # Static mode: Next.js only, serves pre-generated wiki JSON
  codewiki:
    build:
      context: .
      dockerfile: Dockerfile
      target: static
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

